<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özür Dilerim</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="content">
            <div class="envelope-wrapper" tabindex="0" role="button" aria-label="Zarfı açmak için tıkla">
                <div class="click-hint">Açmak İçin Tıkla</div>
                <div class="flap"></div>
                <div class="envelope-body"></div>
                <div class="letter">
                    <h1>Özür Dilerim</h1>
                    <p class="subtitle">Bu çiçekler senin için 💐</p>
                    <p class="message">
                        Seni üzdüğüm için çok üzgünüm. Kalbimin derinliklerinden gelen bu özrü kabul etmeni umuyorum.
                        Her zaman benim için özel ve değerlisin.
                    </p>
                </div>
            </div>
        <button class="replay-button" id="replay-button">
            <svg class="replay-icon" viewBox="0 0 24 24" width="24" height="24">
                <path d="M12 5V2L8 6l4 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z" fill="currentColor"/>
            </svg>
            Tekrar Oynat
        </button>
        <div id="flower-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
